name: Cuff Readiness
description: Run the released Cuff package's Git-anchored readiness check.
inputs:
  version:
    description: Cuff package version to install with uv.
    required: false
    default: "0.2.2"
  working-directory:
    description: Initialized Git worktree root where cuff check runs.
    required: false
    default: "."
  work-item:
    description: Exact Cuff work-item identifier to check.
    required: true
  base:
    description: Explicit Git comparison base ref.
    required: true
  head:
    description: Explicit Git comparison head ref.
    required: true
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.32"
    - name: Install released Cuff package
      shell: bash
      env:
        CUFF_VERSION: ${{ inputs.version }}
        UV_TOOL_DIR: ${{ runner.temp }}/cuff-tool
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/cuff-bin
      run: uv tool install "cuff-cli==$CUFF_VERSION"
    - name: Run Cuff check
      shell: bash
      env:
        CUFF_WORKSPACE: ${{ inputs.working-directory }}
        CUFF_WORK_ITEM: ${{ inputs.work-item }}
        CUFF_BASE: ${{ inputs.base }}
        CUFF_HEAD: ${{ inputs.head }}
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/cuff-bin
      run: >-
        "$UV_TOOL_BIN_DIR/cuff" check
        --workspace "$CUFF_WORKSPACE"
        --work-item "$CUFF_WORK_ITEM"
        --base "$CUFF_BASE"
        --head "$CUFF_HEAD"
