name: Fab7 Readiness
description: Run the released Fab7 package's Git-anchored readiness check.
inputs:
  version:
    description: Fab7 package version to install with uv.
    required: false
    default: "0.1.0"
  working-directory:
    description: Initialized Git worktree root where fab7 check runs.
    required: false
    default: "."
  work-item:
    description: Exact Fab7 work-item identifier to check.
    required: true
  base:
    description: Explicit Git comparison base ref.
    required: true
  head:
    description: Explicit Git comparison head ref.
    required: true
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.32"
    - name: Install released Fab7 package
      shell: bash
      env:
        FAB7_VERSION: ${{ inputs.version }}
        UV_TOOL_DIR: ${{ runner.temp }}/fab7-tool
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/fab7-bin
      run: uv tool install "fab7-cli==$FAB7_VERSION"
    - name: Run Fab7 check
      shell: bash
      env:
        FAB7_WORKSPACE: ${{ inputs.working-directory }}
        FAB7_WORK_ITEM: ${{ inputs.work-item }}
        FAB7_BASE: ${{ inputs.base }}
        FAB7_HEAD: ${{ inputs.head }}
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/fab7-bin
      run: >-
        "$UV_TOOL_BIN_DIR/fab7" check
        --workspace "$FAB7_WORKSPACE"
        --work-item "$FAB7_WORK_ITEM"
        --base "$FAB7_BASE"
        --head "$FAB7_HEAD"
