name: Bug report
description: Report a reproducible Cuff CLI, ledger, packaging, or static-integration defect.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, or an unpatched vulnerability. Use the private security-reporting link for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Cuff version
      placeholder: 0.2.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Project initialization
        - Claim, verify, seal, or check
        - Ledger or Git readiness
        - Python package or GitHub Action
        - Static host integration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS or Linux, architecture, uv version
    validations:
      required: true
