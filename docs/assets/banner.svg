<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="auto">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#30363d" />
    </pattern>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background & Technical Blueprint Grid -->
  <rect width="1200" height="450" fill="#0d1117" rx="8"/>
  <rect width="1200" height="450" fill="url(#grid)" rx="8"/>

  <!-- Outer Blueprint Frame -->
  <rect x="15" y="15" width="1170" height="420" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8 4" rx="4"/>
  <rect x="25" y="25" width="1150" height="400" fill="none" stroke="#21262d" stroke-width="1" rx="2"/>

  <!-- Header Technical Labels -->
  <text x="45" y="50" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">FAB7 // SCHEMATIC</text>
  <text x="45" y="66" fill="#8b949e" font-family="monospace" font-size="10" letter-spacing="1">AUTOMATED KNITTING MACHINE &amp; INTEGRATED PROOF LOOM [AKML-7]</text>

  <text x="1000" y="50" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">STATUS: VERIFIED</text>

  <!-- Left Side: Circular Knitting Machine Sketch -->
  <g transform="translate(60, 75)" opacity="0.95">
    <!-- Cylinder Base & Motor Housing -->
    <rect x="30" y="150" width="160" height="60" fill="none" stroke="#8b949e" stroke-width="1.5" rx="2"/>
    <line x1="30" y1="170" x2="190" y2="170" stroke="#30363d" stroke-width="1"/>
    <circle cx="110" cy="180" r="16" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="110" cy="180" r="6" fill="none" stroke="#8b949e" stroke-width="1.5"/>

    <!-- Gear Teeth Sketch -->
    <circle cx="55" cy="180" r="12" fill="none" stroke="#8b949e" stroke-width="1"/>
    <path d="M 45 180 L 65 180 M 55 170 L 55 190" stroke="#30363d" stroke-width="1"/>

    <!-- Circular Needle Bed & Cam Track -->
    <ellipse cx="110" cy="115" rx="90" ry="22" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <ellipse cx="110" cy="102" rx="85" ry="19" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <ellipse cx="110" cy="90" rx="75" ry="16" fill="none" stroke="#388bfd" stroke-width="1.5"/>

    <!-- Needle Teeth Array -->
    <path d="M 25 115 L 25 85 M 35 118 L 35 88 M 45 121 L 45 91 M 55 123 L 55 93 M 65 124 L 65 94 M 75 125 L 75 95 M 85 126 L 85 96 M 95 127 L 95 97 M 105 128 L 105 98 M 115 128 L 115 98 M 125 127 L 125 97 M 135 126 L 135 96 M 145 125 L 145 95 M 155 124 L 155 94 M 165 123 L 165 93 M 175 121 L 175 91 M 185 118 L 185 88 M 195 115 L 195 85" stroke="#8b949e" stroke-width="1.2"/>

    <!-- Sinker Ring Top Frame -->
    <ellipse cx="110" cy="72" rx="60" ry="12" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Yarns Feeding into Cylinder (Cyan Light Threads) -->
    <path d="M 30 15 Q 70 45 95 75" fill="none" stroke="#39c5bb" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <path d="M 70 10 Q 90 40 105 72" fill="none" stroke="#39c5bb" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <path d="M 110 5 Q 110 35 115 70" fill="none" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <path d="M 150 10 Q 130 40 120 72" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>
    <path d="M 190 15 Q 150 45 128 75" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>

    <!-- Technical Annotations -->
    <line x1="195" y1="90" x2="235" y2="75" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="240" y="78" fill="#8b949e" font-family="monospace" font-size="9">1A. CIRCULAR NEEDLE BED</text>

    <line x1="190" y1="165" x2="235" y2="175" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="240" y="178" fill="#8b949e" font-family="monospace" font-size="9">1B. DRIVE GEARS &amp; CAM TRACK</text>
  </g>

  <!-- Center-Right Fabric Interweaving (Warp & Weft Mesh) -->
  <g transform="translate(320, 110)">
    <!-- Woven Mesh Lattice Background -->
    <path d="M 0 50 C 80 20, 160 80, 240 50 S 400 20, 480 50" fill="none" stroke="#1f6beb" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 70 C 80 40, 160 100, 240 70 S 400 40, 480 70" fill="none" stroke="#39c5bb" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <path d="M 0 90 C 80 60, 160 120, 240 90 S 400 60, 480 90" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>
    <path d="M 0 110 C 80 80, 160 140, 240 110 S 400 80, 480 110" fill="none" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>

    <!-- Vertical Weft Threads Crossing -->
    <line x1="40" y1="20" x2="40" y2="130" stroke="#39c5bb" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="80" y1="20" x2="80" y2="130" stroke="#d29922" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="120" y1="20" x2="120" y2="130" stroke="#39c5bb" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="160" y1="20" x2="160" y2="130" stroke="#d29922" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="200" y1="20" x2="200" y2="130" stroke="#39c5bb" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="240" y1="20" x2="240" y2="130" stroke="#d29922" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="280" y1="20" x2="280" y2="130" stroke="#39c5bb" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="320" y1="20" x2="320" y2="130" stroke="#d29922" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="360" y1="20" x2="360" y2="130" stroke="#39c5bb" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="400" y1="20" x2="400" y2="130" stroke="#d29922" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
    <line x1="440" y1="20" x2="440" y2="130" stroke="#39c5bb" stroke-width="1" stroke-dasharray="4 2" opacity="0.8"/>
  </g>

  <!-- Right Side: Loom Harness, Reed & Take-up Roller Sketch -->
  <g transform="translate(820, 80)" opacity="0.95">
    <!-- Loom Heald Frames -->
    <rect x="20" y="20" width="12" height="150" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="45" y="20" width="12" height="150" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="70" y="20" width="12" height="150" fill="none" stroke="#58a6ff" stroke-width="1.5"/>

    <!-- Reed Wires -->
    <line x1="100" y1="30" x2="100" y2="160" stroke="#8b949e" stroke-width="1"/>
    <line x1="104" y1="30" x2="104" y2="160" stroke="#8b949e" stroke-width="1"/>
    <line x1="108" y1="30" x2="108" y2="160" stroke="#8b949e" stroke-width="1"/>
    <line x1="112" y1="30" x2="112" y2="160" stroke="#8b949e" stroke-width="1"/>

    <!-- Shuttle Beam -->
    <polygon points="85,95 135,80 135,110" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>

    <!-- Take-up Roller -->
    <ellipse cx="220" cy="95" rx="30" ry="55" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <ellipse cx="220" cy="95" rx="12" ry="24" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="220" y1="40" x2="270" y2="40" stroke="#30363d" stroke-width="1.5"/>
    <line x1="220" y1="150" x2="270" y2="150" stroke="#30363d" stroke-width="1.5"/>
    <path d="M 270 40 A 55 55 0 0 1 270 150" fill="none" stroke="#8b949e" stroke-width="1.5"/>

    <!-- Annotations -->
    <line x1="50" y1="175" x2="50" y2="195" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="15" y="208" fill="#8b949e" font-family="monospace" font-size="9">2A. HEALD FRAMES &amp; REED</text>

    <line x1="220" y1="155" x2="220" y2="195" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="185" y="208" fill="#8b949e" font-family="monospace" font-size="9">2B. FABRIC ROLLER</text>
  </g>

  <!-- Separate Bottom Branding Bar (Zero Overlap with Drawing) -->
  <g transform="translate(45, 305)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1110" y2="0" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Title & Tagline at the Very Bottom -->
    <text x="555" y="45" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8" text-anchor="middle" filter="url(#glow-cyan)">FAB7</text>
    <text x="555" y="72" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">CORE PROOF GATE &amp; REPOSITORY BACKBONE</text>
    <text x="555" y="94" fill="#8b949e" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="middle">DETERMINISTIC EVIDENCE // ZERO-TRUST FRESHNESS // WARP &amp; WEFT VERIFICATION</text>
  </g>
</svg>
